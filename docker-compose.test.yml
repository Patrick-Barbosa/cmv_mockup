services:
  db-test:
    image: postgres:16-alpine
    container_name: cmv_db_test
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5431:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmv_backend_test
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-test:5432/postgres
      ALLOWED_ORIGINS: "*"
    depends_on:
      db-test:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      default:
        aliases:
          - backend

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cmv_frontend_test
    environment:
      # No build-time env injection for vanilla JS, but we can use this for reference
      BACKEND_URL: http://localhost:8001
    depends_on:
      - backend-test
    ports:
      - "8081:80"

networks:
  default:
    name: cmv_mockup_default
